<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion – Examen civique</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f4f4;
    }
    .auth-container {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px 22px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37,99,235,0.2);
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 9px 12px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-secondary:hover {
      background: #f3f4f6;
    }
    .google-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: url("https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg")
                  center/contain no-repeat;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .divider-text {
      padding: 0 8px;
      font-size: 0.8rem;
      color: #9ca3af;
      text-transform: uppercase;
    }
    .switch-mode {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      color: #4b5563;
    }
    .switch-mode button {
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font-weight: 600;
      padding: 0 4px;
    }
    .error {
      font-size: 0.85rem;
      color: #b91c1c;
      margin-bottom: 8px;
      min-height: 1em;
    }
    .success {
      font-size: 0.85rem;
      color: #16a34a;
      margin-bottom: 8px;
      min-height: 1em;
    }
    .forgot-container {
      text-align: right;
      margin-top: -4px;
      margin-bottom: 10px;
    }
    .link-button {
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
      text-decoration: underline;
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .auth-container { padding: 16px 14px; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>Connexion</h1>
    <div class="subtitle">Connecte-toi pour accéder aux QCM</div>

    <div id="message" class="error"></div>
    <div id="success" class="success"></div>

    <!-- Formulaire email / mot de passe -->
    <form id="auth-form">
      <label for="email">Adresse e‑mail</label>
      <input type="email" id="email" autocomplete="email" required />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required />

      <div class="forgot-container">
        <button type="button" id="forgot-password-btn" class="link-button">
          Mot de passe oublié ?
        </button>
      </div>

      <button type="submit" class="btn btn-primary" id="email-submit-btn">
        Continuer
      </button>
    </form>

    <div class="switch-mode">
      <span id="mode-text">Pas encore de compte ?</span>
      <button type="button" id="toggle-mode-btn">Créer un compte</button>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">ou</div>
      <div class="divider-line"></div>
    </div>

    <!-- Google Sign-In -->
    <button type="button" class="btn btn-secondary" id="google-btn">
      <span class="google-icon"></span>
      <span>Continuer avec Google</span>
    </button>
  </div>

  <!-- Firebase (modular SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      sendEmailVerification,
      sendPasswordResetEmail,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDoM5iwQU472-lX2FSX8h2Azllbq6D3vOk",
      authDomain: "qcm-examen-civique-db.firebaseapp.com",
      projectId: "qcm-examen-civique-db",
      storageBucket: "qcm-examen-civique-db.firebasestorage.app",
      messagingSenderId: "899569839204",
      appId: "1:899569839204:web:7da2cfe9d1e66c6b620371",
      measurementId: "G-S92WT27FBT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const form = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailSubmitBtn = document.getElementById("email-submit-btn");
    const googleBtn = document.getElementById("google-btn");
    const messageEl = document.getElementById("message");
    const successEl = document.getElementById("success");
    const toggleModeBtn = document.getElementById("toggle-mode-btn");
    const modeText = document.getElementById("mode-text");
    const forgotPasswordBtn = document.getElementById("forgot-password-btn");

    let mode = "login"; // "login" ou "signup"

    function setError(msg) {
      messageEl.textContent = msg || "";
      successEl.textContent = "";
    }

    function setSuccess(msg) {
      successEl.textContent = msg || "";
      messageEl.textContent = "";
    }

    function setLoading(loading) {
      emailSubmitBtn.disabled = loading;
      googleBtn.disabled = loading;
      forgotPasswordBtn.disabled = loading;
      emailSubmitBtn.textContent =
        loading
          ? (mode === "login" ? "Connexion..." : "Création du compte...")
          : (mode === "login" ? "Continuer" : "Créer le compte");
    }

    // Basculer entre connexion / inscription
    toggleModeBtn.addEventListener("click", () => {
      if (mode === "login") {
        mode = "signup";
        emailSubmitBtn.textContent = "Créer le compte";
        modeText.textContent = "Déjà un compte ?";
        toggleModeBtn.textContent = "Se connecter";
      } else {
        mode = "login";
        emailSubmitBtn.textContent = "Continuer";
        modeText.textContent = "Pas encore de compte ?";
        toggleModeBtn.textContent = "Créer un compte";
      }
      setError("");
      setSuccess("");
    });

    // Email / mot de passe avec vérification d'email
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setError("");
      setSuccess("");
      setLoading(true);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validation simple du format e‑mail
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        setError("Merci de saisir une adresse e‑mail valide.");
        setLoading(false);
        return;
      }

      try {
        if (mode === "login") {
          const cred = await signInWithEmailAndPassword(auth, email, password);

          if (!cred.user.emailVerified) {
            await signOut(auth);
            setError(
              "Ton e‑mail n'est pas encore vérifié. Clique sur le lien de vérification dans ta boîte mail (pense à vérifier le dossier Spam)."
            );
            return;
          }

          setSuccess("Connexion réussie. Redirection...");
          window.location.href = "index.html";
        } else {
          // Création de compte
          const cred = await createUserWithEmailAndPassword(auth, email, password);

          // URL de redirection après clic sur le lien de vérification (GitHub Pages)
          const actionCodeSettings = {
            url: window.location.origin + "/examen-civique/auth.html",
            handleCodeInApp: false
          };

          await sendEmailVerification(cred.user, actionCodeSettings);

          // On déconnecte tant que l'e‑mail n'est pas vérifié
          await signOut(auth);

          setSuccess(
            "Compte créé. Un e‑mail de vérification t'a été envoyé. " +
            "Vérifie ta boîte mail et, si besoin, le dossier Spam, puis clique sur le lien pour valider ton compte."
          );
        }
      } catch (err) {
        console.error(err);

        // Firebase peut renvoyer auth/invalid-credential à la place de wrong-password/user-not-found quand la protection d’énumération est activée.[web:447][web:448]
        if (
          err.code === "auth/invalid-credential" ||
          err.code === "auth/wrong-password" ||
          err.code === "auth/user-not-found" ||
          err.code === "auth/invalid-login-credentials"
        ) {
          setError("Adresse e‑mail ou mot de passe incorrect.");
        } else if (err.code === "auth/email-already-in-use") {
          setError("Cette adresse e‑mail est déjà utilisée.");
        } else if (err.code === "auth/invalid-email") {
          setError("Adresse e‑mail invalide.");
        } else if (err.code === "auth/weak-password") {
          setError("Mot de passe trop faible (au moins 6 caractères).");
        } else if (err.code === "auth/user-disabled") {
          setError("Ce compte est désactivé. Contacte l’administrateur.");
        } else {
          setError("Une erreur s’est produite. Merci de réessayer.");
        }
      } finally {
        setLoading(false);
      }
    });

    // Mot de passe oublié
    forgotPasswordBtn.addEventListener("click", async () => {
      setError("");
      setSuccess("");

      const email = emailInput.value.trim();

      if (!email) {
        setError("Saisis ton adresse e‑mail pour réinitialiser le mot de passe.");
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        setError("Merci de saisir une adresse e‑mail valide.");
        return;
      }

      setLoading(true);
      try {
        const resetSettings = {
          url: window.location.origin + "/examen-civique/auth.html",
          handleCodeInApp: false
        };

        await sendPasswordResetEmail(auth, email, resetSettings);

        setSuccess(
          "Un e‑mail de réinitialisation de mot de passe t'a été envoyé. " +
          "Vérifie ta boîte mail et, si besoin, le dossier Spam."
        );
      } catch (err) {
        console.error(err);
        if (err.code === "auth/user-not-found") {
          setError("Aucun compte trouvé avec cette adresse e‑mail.");
        } else if (err.code === "auth/invalid-email") {
          setError("Adresse e‑mail invalide.");
        } else {
          setError("Erreur lors de l'envoi de l'e‑mail de réinitialisation.");
        }
      } finally {
        setLoading(false);
      }
    });

    // Google
    googleBtn.addEventListener("click", async () => {
      setError("");
      setSuccess("");
      setLoading(true);
      try {
        await signInWithPopup(auth, provider);
        setSuccess("Connexion Google réussie. Redirection...");
        window.location.href = "index.html";
      } catch (err) {
        console.error(err);
        setError("Erreur Google : impossible de se connecter. Merci de réessayer.");
      } finally {
        setLoading(false);
      }
    });

    // Redirection si déjà connecté et e‑mail vérifié
    onAuthStateChanged(auth, (user) => {
      if (user && user.emailVerified) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
