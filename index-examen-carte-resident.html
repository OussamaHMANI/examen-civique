<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QCM – Examen civique carte de résident</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            text-align: center;
        }

        #progress {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 12px;
        }

        #question {
            font-size: 1.1rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .choice-btn {
            text-align: left;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .choice-btn:hover {
            background: #f0f0f0;
        }

        .choice-btn.selected {
            border-color: #2563eb;
            background: #e0ecff;
        }

        .choice-btn.correct {
            background: #16a34a;
            color: #fff;
            border-color: #15803d;
        }

        .choice-btn.incorrect {
            background: #dc2626;
            color: #fff;
            border-color: #b91c1c;
        }

        #controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        #nextBtn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #nextBtn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #nextBtn:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        #result h2 {
            margin-top: 0;
        }

        .summary-item {
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .tag-good {
            color: #16a34a;
            font-weight: 600;
        }

        .tag-bad {
            color: #dc2626;
            font-weight: 600;
        }

        .restart-btn {
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #6b7280;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Zone de résultat globale */
        #result {
            display: none;
            margin-top: 24px;
        }

        /* Carte de score en haut */
        .result-header {
            background: #111827;
            color: #f9fafb;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .result-header h2 {
            margin: 0 0 8px;
            font-size: 1.3rem;
        }

        .result-score-line {
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .result-message {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .result-message.success {
            color: #bbf7d0;
        }

        .result-message.fail {
            color: #fecaca;
        }

        /* Liste de correction */
        .result-list-title {
            margin: 0 0 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #111827;
        }

        /* Carte par question */
        .question-review {
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 10px;
            overflow: hidden;
            background: #ffffff;
        }

        .question-review-header {
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-review-header.correct {
            background: #ecfdf5;
            color: #166534;
        }

        .question-review-header.incorrect {
            background: #fef2f2;
            color: #b91c1c;
        }

        .question-review-body {
            padding: 10px 12px 12px;
            font-size: 0.95rem;
            color: #374151;
        }

        .question-review-body p {
            margin: 2px 0;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.correct {
            background: #bbf7d0;
            color: #166534;
        }

        .badge.incorrect {
            background: #fecaca;
            color: #b91c1c;
        }

        /* Bouton recommencer */
        .restart-btn {
            margin-top: 16px;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #6b7280;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .restart-btn:hover {
            background: #4b5563;
        }

        .home-btn {
            display: inline-block;
            margin: 12px 16px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: #111827;
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: 500;
        }

        .home-btn:hover {
            background: #e5e7eb;
        }

        #timer {
            font-size: 1rem;
            font-weight: 600;
            color: #b91c1c;
            margin-bottom: 8px;
            text-align: right;
        }

        /* Responsive mobile */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .quiz-container {
                padding: 16px 14px;
            }

            h1 {
                font-size: 1.3rem;
            }

            #timer {
                text-align: center;
                margin-bottom: 10px;
            }

            .choice-btn {
                font-size: 0.9rem;
                padding: 10px;
            }

            #controls {
                justify-content: center;
            }

            #nextBtn {
                width: 100%;
                border-radius: 999px;
            }
        }
    </style>
</head>

                    "Ignorer une personne blessée",
                    "Filmer une agression sans rien faire",
                    "Se moquer de quelqu’un en difficulté"
                ],
                correctIndex: 0
            },
            {
                question: "Quel exemple illustre une limitation de liberté pour protéger l'intérêt général ?",
                choices: [
                    "L’interdiction de fumer dans les lieux publics fermés",
                    "L’interdiction de parler au téléphone chez soi",
                    "L’interdiction d’avoir une opinion politique",
                    "L’interdiction d’aller au parc"
                ],
                correctIndex: 0
            },
            {
                question: "Quelle est l’attitude à avoir lorsque qu'on est témoin de violences ?",
                choices: [
                    "Ne pas se mettre en danger, alerter les secours et prévenir la police",
                    "Intervenir physiquement à tout prix",
                    "Ne rien faire et partir",
                    "Filmer la scène pour la publier sur les réseaux sociaux"
                ],
                correctIndex: 0
            },
            {
                question: "Quelle est l'infraction la plus grave ?",
                choices: [
                    "Le crime",
                    "Le délit",
                    "La contravention",
                    "La simple incivilité"
                ],
                correctIndex: 0
            },
            {
                question: "Quelle obligation concerne toutes les personnes résidant en France quelle que soit leur nationalité ?",
                choices: [
                    "Respecter les lois françaises",
                    "Voter à toutes les élections",
                    "Adopter la nationalité française",
                    "Appartenir à un parti politique"
                ],
                correctIndex: 0
            },
            {
                question: "Quelle proposition représente un exemple de crime ?",
                choices: [
                    "Un meurtre",
                    "Un stationnement gênant",
                    "Un excès de vitesse léger",
                    "Un retard de paiement de facture"
                ],
                correctIndex: 0
            },
            {
                question: "Quelle proposition représente un exemple de délit ?",
                choices: [
                    "Un vol dans un magasin",
                    "Une simple insulte entre amis",
                    "Un bruit de voisinage ponctuel",
                    "Un oubli de dire bonjour"
                ],
                correctIndex: 0
            },
            {
                question: "Qui veille au maintien de l’ordre public ?",
                choices: [
                    "La police et la gendarmerie sous l’autorité de l’État (préfets, maires…)",
                    "Uniquement les associations de quartier",
                    "Les partis politiques",
                    "Les directeurs d’école uniquement"
                ],
                correctIndex: 0
            },
            {
                question: "S'agissant des déchets, quelle proposition est correcte ?",
                choices: [
                    "On doit les déposer dans les poubelles prévues ou en déchetterie, et les trier si possible",
                    "On peut les jeter dans la rue si personne ne regarde",
                    "On peut les brûler dans la forêt",
                    "On peut les mettre dans les toilettes"
                ],
                correctIndex: 0
            }
        ];
        // --------------------------------------------------------
        // 1) Mélange aléatoire (Fisher–Yates)
        // --------------------------------------------------------
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --------------------------------------------------------
        // 2) Construire un examen blanc de 40 questions (9/9/9/9/4)
        // --------------------------------------------------------
        function buildQuizQuestions() {
            const principes = shuffle(PRINCIPES_QUESTIONS).slice(0, 8);
            const systeme = shuffle(SYSTEME_INSTIT_QUESTIONS).slice(0, 8);
            const droits = shuffle(DROITS_DEVOIRS_QUESTIONS).slice(0, 8);
            const vivre = shuffle(VIVRE_SOCIETE_QUESTIONS).slice(0, 8);
            const histoire = shuffle(HISTOIRE_GEO_CULTURE_QUESTIONS).slice(0, 8); // 9+9+9+9+4 = 40

            const forty = [
                ...principes,
                ...systeme,
                ...droits,
                ...vivre,
                ...histoire
            ];

            return shuffle(forty);
        }

        // --------------------------------------------------------
        // 3) Variables globales (questions + état du quiz)
        // --------------------------------------------------------
        let questions = buildQuizQuestions();
        let currentIndex = 0;
        let score = 0;

        let userAnswers = []; // un objet par question : {question, chosen, correct, isCorrect}
        let selectedChoiceIndex = null;
        let currentRenderedChoices = [];

        const progressEl = document.getElementById("progress");
        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const nextBtn = document.getElementById("nextBtn");
        const resultEl = document.getElementById("result");
        const quizEl = document.getElementById("quiz");
        const timerEl = document.getElementById("timer");

        // --------------------------------------------------------
        // 4) Timer 45 minutes
        // --------------------------------------------------------
        const EXAM_DURATION_SECONDS = 45 * 60; // 45 minutes
        let remainingSeconds = EXAM_DURATION_SECONDS;
        let timerInterval = null;
        let examFinished = false;

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const mm = minutes.toString().padStart(2, "0");
            const ss = seconds.toString().padStart(2, "0");
            timerEl.textContent = `Temps restant : ${mm}:${ss}`;
        }

        function startExamTimer() {
            remainingSeconds = EXAM_DURATION_SECONDS;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                remainingSeconds -= 1;
                updateTimerDisplay();

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    endExamByTime();
                }
            }, 1000);
        }

        function endExamByTime() {
            if (examFinished) return;
            nextBtn.disabled = true;

            // Compléter les réponses manquantes
            for (let i = 0; i < questions.length; i++) {
                if (!userAnswers[i]) {
                    const q = questions[i];
                    userAnswers[i] = {
                        question: q.question,
                        chosen: "(aucune réponse)",
                        correct: q.choices[q.correctIndex],
                        isCorrect: false
                    };
                }
            }

            showResult();
        }

        // --------------------------------------------------------
        // 5) Afficher une question
        // --------------------------------------------------------
        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.question;
            progressEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

            choicesEl.innerHTML = "";
            selectedChoiceIndex = null;
            nextBtn.disabled = true;

            // Créer un tableau { text, isCorrect } et le mélanger
            currentRenderedChoices = shuffle(
                q.choices.map((text, idx) => ({
                    text,
                    isCorrect: idx === q.correctIndex
                }))
            );

            currentRenderedChoices.forEach((choiceObj, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.textContent = choiceObj.text;
                btn.addEventListener("click", () => handleChoiceClick(index));
                choicesEl.appendChild(btn);
            });
        }

        // --------------------------------------------------------
        // 6) Clic sur une réponse (juste sélectionner visuellement)
        // --------------------------------------------------------
        function handleChoiceClick(index) {
            selectedChoiceIndex = index;
            nextBtn.disabled = false;

            const buttons = Array.from(document.querySelectorAll(".choice-btn"));
            buttons.forEach((btn, i) => {
                btn.classList.toggle("selected", i === index);
            });
        }

        // --------------------------------------------------------
        // 7) Bouton "Suivant" / "Terminer"
        // --------------------------------------------------------
        nextBtn.addEventListener("click", () => {
            if (selectedChoiceIndex === null || examFinished) {
                return;
            }

            const q = questions[currentIndex];

            // On trouve l’index de la bonne réponse dans l’ordre mélangé
            const correctRenderedIndex = currentRenderedChoices.findIndex(c => c.isCorrect);

            // On enregistre la réponse pour cette question
            userAnswers[currentIndex] = {
                question: q.question,
                chosen: currentRenderedChoices[selectedChoiceIndex].text,
                correct: currentRenderedChoices[correctRenderedIndex].text,
                isCorrect: currentRenderedChoices[selectedChoiceIndex].isCorrect
            };

            if (currentIndex < questions.length - 1) {
                currentIndex += 1;
                renderQuestion();
            } else {
                showResult();
            }
        });

        // --------------------------------------------------------
        // 8) Résultats + correction
        // --------------------------------------------------------
        function showResult() {
            examFinished = true;

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            quizEl.style.display = "none";
            resultEl.style.display = "block";

            score = 0;
            let questionsHtml = "";

            userAnswers.forEach((entry, index) => {
                if (entry.isCorrect) score += 1;

                questionsHtml += `
      <div class="question-review">
        <div class="question-review-header ${entry.isCorrect ? "correct" : "incorrect"}">
          <span>Q${index + 1}. ${entry.question}</span>
          <span class="badge ${entry.isCorrect ? "correct" : "incorrect"}">
            ${entry.isCorrect ? "Juste" : "Faux"}
          </span>
        </div>
        <div class="question-review-body">
          <p><strong>Ta réponse :</strong> ${entry.chosen}</p>
          <p><strong>Bonne réponse :</strong> ${entry.correct}</p>
        </div>
      </div>
    `;
            });

            const total = userAnswers.length;
            const messageReussite =
                score >= 32 ?
                "Bravo, tu as réussi l'examen blanc !" :
                "Tu n'as pas encore atteint 32/40. Continue à t'entraîner, tu vas y arriver.";

            const headerHtml = `
    <div class="result-header">
      <h2>Résultats de l'examen blanc</h2>
      <div class="result-score-line">
        Score : <strong>${score} / ${total}</strong> (note : <strong>${score} / 40</strong>)
      </div>
      <div class="result-message ${score >= 32 ? "success" : "fail"}">
        ${messageReussite}
      </div>
    </div>
    <p class="result-list-title">Correction détaillée :</p>
  `;

            const footerHtml = `
    <button class="restart-btn" onclick="restartQuiz()">Recommencer un nouvel examen blanc</button>
  `;

            resultEl.innerHTML = headerHtml + questionsHtml + footerHtml;
        }

        // --------------------------------------------------------
        // 9) Redémarrer un examen blanc
        // --------------------------------------------------------
        function restartQuiz() {
            questions = buildQuizQuestions();
            currentIndex = 0;
            score = 0;
            userAnswers = [];
            examFinished = false;

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            quizEl.style.display = "block";
            resultEl.style.display = "none";

            nextBtn.textContent = "Valider";
            renderQuestion();
            startExamTimer();
        }

        // --------------------------------------------------------
        // 10) Démarrage
        // --------------------------------------------------------
        nextBtn.textContent = "Valider";
        renderQuestion();
        startExamTimer();
    </script>
</body>
