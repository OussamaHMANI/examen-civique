<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>QCM – Vivre dans la société française</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            text-align: center;
        }

        #progress {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 12px;
        }

        #question {
            font-size: 1.1rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .choice-btn {
            text-align: left;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .choice-btn:hover {
            background: #f0f0f0;
        }

        .choice-btn.selected {
            border-color: #2563eb;
            background: #e0ecff;
        }

        .choice-btn.correct {
            background: #16a34a;
            color: #fff;
            border-color: #15803d;
        }

        .choice-btn.incorrect {
            background: #dc2626;
            color: #fff;
            border-color: #b91c1c;
        }

        #controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        #nextBtn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #nextBtn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #nextBtn:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        #result h2 {
            margin-top: 0;
        }

        .summary-item {
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .tag-good {
            color: #16a34a;
            font-weight: 600;
        }

        .tag-bad {
            color: #dc2626;
            font-weight: 600;
        }

        .restart-btn {
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #6b7280;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .home-btn {
            display: inline-block;
            margin: 12px 16px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: #111827;
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: 500;
        }

        .home-btn:hover {
            background: #e5e7eb;
        }
    </style>
</head>

<body>
    <a href="index.html" class="home-btn">← Retour à l’accueil</a>

        // --------------------------------------------------------
        // 2) Mélange aléatoire (Fisher–Yates)
        // --------------------------------------------------------
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const TOTAL_QUESTIONS = ALL_QUESTIONS.length;
        let questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);

        // --------------------------------------------------------
        // 3) Logique du quiz
        // --------------------------------------------------------
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        const progressEl = document.getElementById("progress");
        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const nextBtn = document.getElementById("nextBtn");
        const resultEl = document.getElementById("result");
        const quizEl = document.getElementById("quiz");

        let selectedChoiceIndex = null;
        let locked = false;
        let currentRenderedChoices = []; // nouveau

        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.question;
            progressEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

            choicesEl.innerHTML = "";
            selectedChoiceIndex = null;
            locked = false;
            nextBtn.disabled = true;

            // on crée un tableau { text, isCorrect } puis on le mélange
            currentRenderedChoices = shuffle(
                q.choices.map((text, idx) => ({
                    text,
                    isCorrect: idx === q.correctIndex
                }))
            );

            currentRenderedChoices.forEach((choiceObj, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.textContent = choiceObj.text;
                btn.addEventListener("click", () => handleChoiceClick(index));
                choicesEl.appendChild(btn);
            });
        }

        function handleChoiceClick(index) {
            if (locked) return;

            selectedChoiceIndex = index;
            nextBtn.disabled = false;

            const buttons = Array.from(document.querySelectorAll(".choice-btn"));
            buttons.forEach((btn, i) => {
                btn.classList.toggle("selected", i === index);
            });
        }

        function validateAnswer() {
            const buttons = Array.from(document.querySelectorAll(".choice-btn"));

            if (selectedChoiceIndex === null) return;

            locked = true;
            nextBtn.disabled = false;

            // on trouve l’index du bouton correct dans l’ordre mélangé
            const correctRenderedIndex = currentRenderedChoices.findIndex(c => c.isCorrect);

            buttons.forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === correctRenderedIndex) {
                    btn.classList.add("correct");
                }
                if (i === selectedChoiceIndex && i !== correctRenderedIndex) {
                    btn.classList.add("incorrect");
                }
            });

            const isCorrect = currentRenderedChoices[selectedChoiceIndex].isCorrect;
            if (isCorrect) {
                score += 1;
            }

            // pour le résumé, on récupère les textes à partir de currentRenderedChoices
            userAnswers.push({
                question: questions[currentIndex].question,
                chosen: currentRenderedChoices[selectedChoiceIndex].text,
                correct: currentRenderedChoices[correctRenderedIndex].text,
                isCorrect
            });
        }

        function showResult() {
            const total = questions.length;
            const noteSur40 = score;

            quizEl.style.display = "none";
            resultEl.style.display = "block";

            let html = `
        <h2>Résultats</h2>
        <p>Vous avez obtenu <strong>${score} / ${total}</strong>, soit une note de <strong>${noteSur40} / {TOTAL_QUESTIONS.length}</strong>.</p>
        <p>Résumé des réponses :</p>
      `;

            userAnswers.forEach((entry, index) => {
                html += `
          <div class="summary-item">
            <strong>Q${index + 1}.</strong> ${entry.question}<br>
            Votre réponse : <span class="${entry.isCorrect ? "tag-good" : "tag-bad"}">
              ${entry.chosen} (${entry.isCorrect ? "Juste" : "Faux"})
            </span><br>
            Bonne réponse : <strong>${entry.correct}</strong>
          </div>
        `;
            });

            html += `
        <button class="restart-btn" onclick="restartQuiz()">Recommencer un nouveau QCM</button>
      `;

            resultEl.innerHTML = html;
        }

        function restartQuiz() {
            questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            quizEl.style.display = "block";
            resultEl.style.display = "none";

            nextBtn.textContent = "Valider";
            renderQuestion();
        }

        nextBtn.addEventListener("click", () => {
            if (!locked) {
                validateAnswer();
                if (currentIndex < questions.length - 1) {
                    nextBtn.textContent = "Question suivante";
                } else {
                    nextBtn.textContent = "Voir les résultats";
                }
                return;
            }

            if (currentIndex < questions.length - 1) {
                currentIndex += 1;
                nextBtn.textContent = "Valider";
                renderQuestion();
            } else {
                showResult();
            }
        });

        nextBtn.textContent = "Valider";
        renderQuestion();
    </script>
</body>

</html>
