  <title>QCM – Droits et devoirs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f4f4;
    }

    .home-btn {
      display: inline-block;
      margin-bottom: 12px;
      text-decoration: none;
      color: #2563eb;
      font-size: 0.95rem;
    }

    .quiz-container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px 22px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 12px;
    }

    #progress {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 8px;
    }

    #question {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .choice-btn {
      text-align: left;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .choice-btn:hover {
      background: #f3f4f6;
    }

    .choice-btn.selected {
      border-color: #2563eb;
      background: #e0ecff;
    }

    .choice-btn.correct {
      background: #16a34a;
      border-color: #15803d;
      color: #ffffff;
    }

    .choice-btn.incorrect {
      background: #dc2626;
      border-color: #b91c1c;
      color: #ffffff;
    }

    #controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    #nextBtn {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #nextBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #nextBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #result {
      margin-top: 20px;
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      display: none;
      font-size: 0.95rem;
    }

    .summary-item {
      margin-bottom: 8px;
    }

    .tag-good {
      color: #16a34a;
      font-weight: 600;
    }

    .tag-bad {
      color: #dc2626;
      font-weight: 600;
    }

    /* Responsive mobile */
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .quiz-container {
        padding: 16px 14px;
      }

      h1 {
        font-size: 1.2rem;
      }

      .choice-btn {
        font-size: 0.9rem;
        padding: 10px;
      }

      #controls {
        justify-content: center;
      }

      #nextBtn {
        width: 100%;
      }
    }
  </style>
</head>

                question: "Quelle proposition représente un exemple de délit ?",
                choices: [
                    "Un vol commis dans un magasin, comme la soustraction volontaire d’un objet, constitue un délit pénal.",
                    "Une simple insulte échangée entre amis dans un cadre privé constitue toujours un délit correctionnel.",
                    "Un bruit très ponctuel causé par un voisin à une heure autorisée est systématiquement qualifié de délit.",
                    "Le fait de ne pas saluer une personne dans la rue est assimilé à un délit contre la dignité humaine."
                ],
                correctIndex: 0
            },
            {
                question: "Qui veille au maintien de l’ordre public ?",
                choices: [
                    "Les services de police et de gendarmerie, sous l’autorité des préfets, des maires et de l’État.",
                    "Les seules associations de quartier, qui décident librement des règles de sécurité applicables.",
                    "Les partis politiques, qui exercent directement la force publique sur le territoire national.",
                    "Les directeurs d’établissement scolaire, qui disposent des pouvoirs de police sur la voie publique."
                ],
                correctIndex: 0
            },
            {
                question: "S'agissant des déchets, quelle proposition est correcte ?",
                choices: [
                    "Ils doivent être déposés dans les poubelles appropriées ou en déchetterie, en respectant le tri lorsque c’est possible.",
                    "On peut les jeter sur la voie publique dès lors que l’on contribue déjà à financer le service de nettoyage.",
                    "On peut les brûler en pleine forêt ou en plein air pour éviter d’encombrer les bennes à ordures ménagères.",
                    "On peut les évacuer dans les toilettes ou les égouts, car ils seront automatiquement traités par les réseaux."
                ],
                correctIndex: 0
            }
        ];

        // --------------------------------------------------------
        // 2) Mélange aléatoire (Fisher–Yates)
        // --------------------------------------------------------
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const TOTAL_QUESTIONS = 40;
        let questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);

        // --------------------------------------------------------
        // 3) Logique du quiz
        // --------------------------------------------------------
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        const progressEl = document.getElementById("progress");
        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const nextBtn = document.getElementById("nextBtn");
        const resultEl = document.getElementById("result");
        const quizEl = document.getElementById("quiz");

        let selectedChoiceIndex = null;
        let locked = false;
        let currentRenderedChoices = []; // nouveau

        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.question;
            progressEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

            choicesEl.innerHTML = "";
            selectedChoiceIndex = null;
            locked = false;
            nextBtn.disabled = true;

            // on crée un tableau { text, isCorrect } puis on le mélange
            currentRenderedChoices = shuffle(
                q.choices.map((text, idx) => ({
                    text,
                    isCorrect: idx === q.correctIndex
                }))
            );

            currentRenderedChoices.forEach((choiceObj, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.textContent = choiceObj.text;
                btn.addEventListener("click", () => handleChoiceClick(index));
                choicesEl.appendChild(btn);
            });
        }

        function handleChoiceClick(index) {
            if (locked) return;

            selectedChoiceIndex = index;
            nextBtn.disabled = false;

            const buttons = Array.from(document.querySelectorAll(".choice-btn"));
            buttons.forEach((btn, i) => {
                btn.classList.toggle("selected", i === index);
            });
        }

        function validateAnswer() {
            const buttons = Array.from(document.querySelectorAll(".choice-btn"));

            if (selectedChoiceIndex === null) return;

            locked = true;
            nextBtn.disabled = false;

            // on trouve l’index du bouton correct dans l’ordre mélangé
            const correctRenderedIndex = currentRenderedChoices.findIndex(c => c.isCorrect);

            buttons.forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === correctRenderedIndex) {
                    btn.classList.add("correct");
                }
                if (i === selectedChoiceIndex && i !== correctRenderedIndex) {
                    btn.classList.add("incorrect");
                }
            });

            const isCorrect = currentRenderedChoices[selectedChoiceIndex].isCorrect;
            if (isCorrect) {
                score += 1;
            }

            // pour le résumé, on récupère les textes à partir de currentRenderedChoices
            userAnswers.push({
                question: questions[currentIndex].question,
                chosen: currentRenderedChoices[selectedChoiceIndex].text,
                correct: currentRenderedChoices[correctRenderedIndex].text,
                isCorrect
            });
        }

        function showResult() {
            const total = questions.length;
            const noteSur40 = score;

            quizEl.style.display = "none";
            resultEl.style.display = "block";

            let html = `
        <h2>Résultats</h2>
        <p>Vous avez obtenu <strong>${score} / ${total}</strong>, soit une note de <strong>${noteSur40} / 40</strong>.</p>
        <p>Résumé des réponses :</p>
      `;

            userAnswers.forEach((entry, index) => {
                html += `
          <div class="summary-item">
            <strong>Q${index + 1}.</strong> ${entry.question}<br>
            Votre réponse : <span class="${entry.isCorrect ? "tag-good" : "tag-bad"}">
              ${entry.chosen} (${entry.isCorrect ? "Juste" : "Faux"})
            </span><br>
            Bonne réponse : <strong>${entry.correct}</strong>
          </div>
        `;
            });

            html += `
        <button class="restart-btn" onclick="restartQuiz()">Recommencer un nouveau QCM</button>
      `;

            resultEl.innerHTML = html;
        }

        function restartQuiz() {
            questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            quizEl.style.display = "block";
            resultEl.style.display = "none";

            nextBtn.textContent = "Valider";
            renderQuestion();
        }

        nextBtn.addEventListener("click", () => {
            if (!locked) {
                validateAnswer();
                if (currentIndex < questions.length - 1) {
                    nextBtn.textContent = "Question suivante";
                } else {
                    nextBtn.textContent = "Voir les résultats";
                }
                return;
            }

            if (currentIndex < questions.length - 1) {
                currentIndex += 1;
                nextBtn.textContent = "Valider";
                renderQuestion();
            } else {
                showResult();
            }
        });

        nextBtn.textContent = "Valider";
        renderQuestion();
    </script>
</body>

</html>
