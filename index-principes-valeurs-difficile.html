                question: "Que représente la laïcité ?",
                choices: [
                    "Un principe qui permet la coexistence de toutes les convictions dans le respect de la loi et de la neutralité de l’État.",
                    "Une religion officielle qui remplacerait l’ensemble des autres religions pratiquées.",
                    "L’interdiction totale de toute pratique religieuse sur le territoire français.",
                    "Un simple conseil moral sans valeur juridique, que chacun suit ou non librement."
                ],
                correctIndex: 0
            },
            {
                question: "Qu'est ce qui est interdit par la Charte de la laïcité à l'école ?",
                choices: [
                    "Le prosélytisme et toute tentative d’imposer sa religion ou ses convictions aux autres élèves ou aux personnels.",
                    "L’enseignement de l’histoire des religions dans un cadre scolaire encadré par des programmes officiels.",
                    "La discussion respectueuse entre élèves à propos de leurs croyances et de leurs opinions.",
                    "La présence d’élèves de religions différentes dans une même classe ou un même établissement."
                ],
                correctIndex: 0
            },
            {
                question: "Que dit l'article 1er de la Constitution française ?",
                choices: [
                    "Que la France est une République indivisible, laïque, démocratique et sociale, assurant l’égalité devant la loi.",
                    "Que la France est une monarchie parlementaire dirigée par un roi et un Parlement.",
                    "Que la France reconnaît une religion officielle qui inspire la totalité de ses lois.",
                    "Que seuls les hommes peuvent être citoyens et exercer pleinement leurs droits politiques."
                ],
                correctIndex: 0
            }
        ];
        // --------------------------------------------------------
        // 2) Mélange aléatoire (Fisher–Yates)
        // --------------------------------------------------------
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const TOTAL_QUESTIONS = 40;
        let questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);

        // --------------------------------------------------------
        // 3) Logique du quiz
        // --------------------------------------------------------
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        const progressEl = document.getElementById("progress");
        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const nextBtn = document.getElementById("nextBtn");
        const resultEl = document.getElementById("result");
        const quizEl = document.getElementById("quiz");

        let selectedChoiceIndex = null;
        let locked = false;
        let currentRenderedChoices = []; // nouveau

        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.question;
            progressEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

            choicesEl.innerHTML = "";
            selectedChoiceIndex = null;
            locked = false;
            nextBtn.disabled = true;

            // on crée un tableau { text, isCorrect } puis on le mélange
            currentRenderedChoices = shuffle(
                q.choices.map((text, idx) => ({
                    text,
                    isCorrect: idx === q.correctIndex
                }))
            );

            currentRenderedChoices.forEach((choiceObj, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.textContent = choiceObj.text;
                btn.addEventListener("click", () => handleChoiceClick(index));
                choicesEl.appendChild(btn);
            });
        }

        function handleChoiceClick(index) {
            if (locked) return;

            selectedChoiceIndex = index;
            nextBtn.disabled = false;

            const buttons = Array.from(document.querySelectorAll(".choice-btn"));
            buttons.forEach((btn, i) => {
                btn.classList.toggle("selected", i === index);
            });
        }

        function validateAnswer() {
            const buttons = Array.from(document.querySelectorAll(".choice-btn"));

            if (selectedChoiceIndex === null) return;

            locked = true;
            nextBtn.disabled = false;

            // on trouve l’index du bouton correct dans l’ordre mélangé
            const correctRenderedIndex = currentRenderedChoices.findIndex(c => c.isCorrect);

            buttons.forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === correctRenderedIndex) {
                    btn.classList.add("correct");
                }
                if (i === selectedChoiceIndex && i !== correctRenderedIndex) {
                    btn.classList.add("incorrect");
                }
            });

            const isCorrect = currentRenderedChoices[selectedChoiceIndex].isCorrect;
            if (isCorrect) {
                score += 1;
            }

            // pour le résumé, on récupère les textes à partir de currentRenderedChoices
            userAnswers.push({
                question: questions[currentIndex].question,
                chosen: currentRenderedChoices[selectedChoiceIndex].text,
                correct: currentRenderedChoices[correctRenderedIndex].text,
                isCorrect
            });
        }

        function showResult() {
            const total = questions.length;
            const noteSur40 = score;

            quizEl.style.display = "none";
            resultEl.style.display = "block";

            let html = `
        <h2>Résultats</h2>
        <p>Vous avez obtenu <strong>${score} / ${total}</strong>, soit une note de <strong>${noteSur40} / 40</strong>.</p>
        <p>Résumé des réponses :</p>
      `;

            userAnswers.forEach((entry, index) => {
                html += `
          <div class="summary-item">
            <strong>Q${index + 1}.</strong> ${entry.question}<br>
            Votre réponse : <span class="${entry.isCorrect ? "tag-good" : "tag-bad"}">
              ${entry.chosen} (${entry.isCorrect ? "Juste" : "Faux"})
            </span><br>
            Bonne réponse : <strong>${entry.correct}</strong>
          </div>
        `;
            });

            html += `
        <button class="restart-btn" onclick="restartQuiz()">Recommencer un nouveau QCM</button>
      `;

            resultEl.innerHTML = html;
        }

        function restartQuiz() {
            questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            quizEl.style.display = "block";
            resultEl.style.display = "none";

            nextBtn.textContent = "Valider";
            renderQuestion();
        }

        nextBtn.addEventListener("click", () => {
            if (!locked) {
                validateAnswer();
                if (currentIndex < questions.length - 1) {
                    nextBtn.textContent = "Question suivante";
                } else {
                    nextBtn.textContent = "Voir les résultats";
                }
                return;
            }

            if (currentIndex < questions.length - 1) {
                currentIndex += 1;
                nextBtn.textContent = "Valider";
                renderQuestion();
            } else {
                showResult();
            }
        });

        nextBtn.textContent = "Valider";
        renderQuestion();
    </script>
</body>

</html>
