            color: #fff;
            border-color: #b91c1c;

            display: flex;
            justify-content: space-between;

            margin-top: 8px;
        }

            border-radius: 6px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;

            background: #9ca3af;
            cursor: not-allowed;
        }

        #nextBtn:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        #result h2 {
            margin-top: 0;
        }

            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .tag-good {
            color: #16a34a;
            font-weight: 600;
        }

            color: #dc2626;
            font-weight: 600;
        }

            border-radius: 6px;
            border: none;
            background: #6b7280;
            color: #fff;

                    "À Paris, dans l’hémicycle de l’Assemblée nationale française.",
                    "À Rome, au sein des institutions de la République italienne.",
                    "À Madrid, dans l’un des principaux bâtiments du gouvernement espagnol."
                ],
                correctIndex: 0
            },
            {
                question: "Où se trouve le siège de la Commission européenne ?",
                choices: [
                    "À Bruxelles, dans la capitale belge, au cœur des institutions de l’Union.",
                    "À Strasbourg, dans la même ville que le Parlement européen.",
                    "À Luxembourg, qui accueille l’ensemble des services de la Commission.",
                    "À Berlin, en lien avec le rôle de l’Allemagne dans l’Union."
                ],
                correctIndex: 0
            },
            {
                question: "Quel État suivant n'est pas membre de l'Union européenne ?",
                choices: [
                    "La Suisse, qui a des accords avec l’Union mais n’en fait pas partie.",
                    "L’Allemagne, qui est l’un des principaux États membres de l’Union.",
                    "L’Italie, qui fait partie des pays fondateurs de la construction européenne.",
                    "L’Espagne, qui a rejoint l’Union européenne dans les années 1980."
                ],
                correctIndex: 0
            },
            {
                question: "Quand célèbre-t-on la journée de l'Europe ?",
                choices: [
                    "Le 9 mai, en mémoire de la déclaration Schuman sur la construction européenne.",
                    "Le 1er janvier, en lien avec l’entrée en vigueur du marché unique.",
                    "Le 14 juillet, en même temps que la fête nationale française.",
                    "Le 25 décembre, lors des fêtes de fin d’année dans l’Union."
                ],
                correctIndex: 0
            },
            {
                question: "À quelle fréquence les élections européennes sont-elles organisées ?",
                choices: [
                    "Tous les 5 ans, pour élire les députés au Parlement européen dans chaque État membre.",
                    "Tous les 2 ans, afin de renouveler la moitié des députés européens.",
                    "Tous les 10 ans, en même temps que les recensements de population.",
                    "Chaque année, en alternance avec les élections nationales."
                ],
                correctIndex: 0
            },
            {
                question: "Quelle condition est nécessaire pour voter aux élections européennes ?",
                choices: [
                    "Être citoyen d’un État membre de l’Union européenne et inscrit sur les listes électorales.",
                    "Résider en Europe depuis au moins un an, même sans nationalité d’un pays membre.",
                    "Parler au moins trois langues européennes reconnues par les institutions.",
                    "Posséder obligatoirement un passeport européen biométrique en cours de validité."
                ],
                correctIndex: 0
            },
            {
                question: "Quel pays est un pays fondateur de l'Union européenne ?",
                choices: [
                    "La France, qui fait partie des États à l’origine des premières communautés européennes.",
                    "La Pologne, qui a rejoint l’Union dès la signature du traité de Rome.",
                    "La Suède, qui est membre fondateur de toutes les institutions européennes.",

        // --------------------------------------------------------
        // 2) Mélange aléatoire (Fisher–Yates)
        // --------------------------------------------------------
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const TOTAL_QUESTIONS = ALL_QUESTIONS.length;
        let questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);

        // --------------------------------------------------------
        // 3) Logique du quiz
        // --------------------------------------------------------
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        const progressEl = document.getElementById("progress");
        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const nextBtn = document.getElementById("nextBtn");
        const resultEl = document.getElementById("result");
        const quizEl = document.getElementById("quiz");

        let selectedChoiceIndex = null;
        let locked = false;
        let currentRenderedChoices = []; // nouveau

        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.question;
            progressEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

            choicesEl.innerHTML = "";
            selectedChoiceIndex = null;
            locked = false;
            nextBtn.disabled = true;

            // on crée un tableau { text, isCorrect } puis on le mélange
            currentRenderedChoices = shuffle(
                q.choices.map((text, idx) => ({
                    text,
                    isCorrect: idx === q.correctIndex
                }))
            );

            currentRenderedChoices.forEach((choiceObj, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.textContent = choiceObj.text;
                btn.addEventListener("click", () => handleChoiceClick(index));
                choicesEl.appendChild(btn);
            });
        }

        function handleChoiceClick(index) {
            if (locked) return;

            selectedChoiceIndex = index;
            nextBtn.disabled = false;

            const buttons = Array.from(document.querySelectorAll(".choice-btn"));
            buttons.forEach((btn, i) => {
                btn.classList.toggle("selected", i === index);
            });
        }

        function validateAnswer() {
            const buttons = Array.from(document.querySelectorAll(".choice-btn"));

            if (selectedChoiceIndex === null) return;

            locked = true;
            nextBtn.disabled = false;

            // on trouve l’index du bouton correct dans l’ordre mélangé
            const correctRenderedIndex = currentRenderedChoices.findIndex(c => c.isCorrect);

            buttons.forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === correctRenderedIndex) {
                    btn.classList.add("correct");
                }
                if (i === selectedChoiceIndex && i !== correctRenderedIndex) {
                    btn.classList.add("incorrect");
                }
            });

            const isCorrect = currentRenderedChoices[selectedChoiceIndex].isCorrect;
            if (isCorrect) {
                score += 1;
            }

            // pour le résumé, on récupère les textes à partir de currentRenderedChoices
            userAnswers.push({
                question: questions[currentIndex].question,
                chosen: currentRenderedChoices[selectedChoiceIndex].text,
                correct: currentRenderedChoices[correctRenderedIndex].text,
                isCorrect
            });
        }

        function showResult() {
            const total = questions.length;
            const noteSur40 = score;

            quizEl.style.display = "none";
            resultEl.style.display = "block";

            let html = `
        <h2>Résultats</h2>
        <p>Vous avez obtenu <strong>${score} / ${total}</strong>, soit une note de <strong>${noteSur40} / {TOTAL_QUESTIONS.length}</strong>.</p>
        <p>Résumé des réponses :</p>
      `;

            userAnswers.forEach((entry, index) => {
                html += `
          <div class="summary-item">
            <strong>Q${index + 1}.</strong> ${entry.question}<br>
            Votre réponse : <span class="${entry.isCorrect ? "tag-good" : "tag-bad"}">
              ${entry.chosen} (${entry.isCorrect ? "Juste" : "Faux"})
            </span><br>
            Bonne réponse : <strong>${entry.correct}</strong>
          </div>
        `;
            });

            html += `
        <button class="restart-btn" onclick="restartQuiz()">Recommencer un nouveau QCM</button>
      `;

            resultEl.innerHTML = html;
        }

        function restartQuiz() {
            questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            quizEl.style.display = "block";
            resultEl.style.display = "none";

            nextBtn.textContent = "Valider";
            renderQuestion();
        }

        nextBtn.addEventListener("click", () => {
            if (!locked) {
                validateAnswer();
                if (currentIndex < questions.length - 1) {
                    nextBtn.textContent = "Question suivante";
                } else {
                    nextBtn.textContent = "Voir les résultats";
                }
                return;
            }

            if (currentIndex < questions.length - 1) {
                currentIndex += 1;
                nextBtn.textContent = "Valider";
                renderQuestion();
            } else {
                showResult();
            }
        });

        nextBtn.textContent = "Valider";
        renderQuestion();
    </script>
